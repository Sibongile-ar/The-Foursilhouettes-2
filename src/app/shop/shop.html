<div class="products-container">

    <h2>Our Products</h2>
  
    <div class="products-grid">
  
      <div class="product-card" *ngFor="let product of productList">
  
        <img [src]="product.image" alt="images">
        <h3>{{ product.title }}</h3>
        <p class="description"> {{product.description}}</p>

        <div class="price-row">
          <p class="category">
            Category: {{ product.category}} </p>
          <p class="price"> R {{ product.price }} </p>
  
        </div>

        <div class="sizes">

            <label>
              <input
                type="radio"
                [name]="'size' + product.id"
                value="S"
                [(ngModel)]="selectedSizes[product.id]"
              >
              S
            </label>
      
            <label>
              <input
                type="radio"
                [name]="'size' + product.id"
                value="M"
                [(ngModel)]="selectedSizes[product.id]"
              >
              M
            </label>
      
            <label>
              <input
                type="radio"
                [name]="'size' + product.id"
                value="L"
                [(ngModel)]="selectedSizes[product.id]"
              >
              L
            </label>
      
            <label>
              <input
                type="radio"
                [name]="'size' + product.id"
                value="XL"
                [(ngModel)]="selectedSizes[product.id]"
              >
              XL
            </label>
      
          </div>
  
        <button (click)="addToCart(product)">
          Add to Cart
        </button>
      </div>
  
    </div>
  
  </div>
