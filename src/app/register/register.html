<div class="auth-container">

    <h2>Register</h2>
  
    <input
      type="text"
      placeholder="Full Name"
      [(ngModel)]="name">
  
    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email">
  
    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password">
  
    <button (click)="register()">
      Register
    </button>
  
  </div>
