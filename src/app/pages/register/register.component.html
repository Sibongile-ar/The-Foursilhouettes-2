<div class="register-wrapper">
  <h2>Register</h2>

  <form (ngSubmit)="register()">

    <input
      type="text"
      placeholder="Full Name"
      [(ngModel)]="user.name"
      name="name"
      required>

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="user.email"
      name="email"
      required>

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="user.password"
      name="password"
      required>

    <button type="submit" class="register-btn">
      Register
    </button>

  </form>

  <p class="login-link">
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
