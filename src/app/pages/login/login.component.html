<div class="login-wrapper">
  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required>

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required>

    <button type="submit" class="login-btn">
      Login
    </button>

  </form>

  <p class="register-link">
    Don't have an account? <a routerLink="/register">Register here</a>
  </p>
</div>
