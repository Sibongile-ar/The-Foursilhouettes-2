
 <header>
    <div class="nav-container">
      <h1>The Four Silhouettes</h1>

      <nav>

        <a routerLink="home">Home</a>
        <a routerLink="shop">Shop</a>
        <a routerLink="about">About</a>
      
        <a
          *ngIf="!authService.isLoggedIn()"
          routerLink="/login">
          Login
        </a>
      
        <a
          *ngIf="!authService.isLoggedIn()"
          routerLink="/register">
          Register
        </a>
      
        <span *ngIf="authService.isLoggedIn()">
          Hi {{ authService.getLoggedUser()?.name }}
        </span>
      
        <a
          *ngIf="authService.isLoggedIn()"
          (click)="logout()">
          Logout
        </a>
      
        <a
          (click)="goToCart()"
          class="cart">
          Cart ({{ cartService.getCartCount() }})
        </a>
      
      </nav>
    </div>

  </header>
